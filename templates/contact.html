{% extends 'base.html' %}
{% load static %}

{% block title %}Контакты — Old Rebel{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 0 auto; padding: 20px;">

    {% include 'breadcrumbs.html' with breadcrumbs=breadcrumbs %}

    <h2 style="color: #b22222; text-align: center; font-family: 'Impact', sans-serif; letter-spacing: 4px;">
        НАПИСАТЬ НАМ
    </h2>
    <p style="text-align: center; color: #888; font-style: italic; margin-bottom: 30px;">
        Есть вопрос или предложение? Напишите нам — мы обязательно ответим.
    </p>

    <div style="background: #1a1c1e; padding: 25px; border-radius: 8px; border: 1px solid #2a2c2e;">

        <form method="post" action="{% url 'contact_submit' %}">
            {% csrf_token %}

            <div style="margin-bottom: 15px;">
                <label for="name" style="color: #d4c9b8; display: block; margin-bottom: 5px;">Имя *</label>
                <input type="text" id="name" name="name" required style="
                    width: 100%;
                    padding: 10px;
                    background: #0d0e0f;
                    border: 1px solid #2a2c2e;
                    border-radius: 4px;
                    color: #d4c9b8;
                ">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="color: #d4c9b8; display: block; margin-bottom: 5px;">Email *</label>
                <input type="email" id="email" name="email" required style="
                    width: 100%;
                    padding: 10px;
                    background: #0d0e0f;
                    border: 1px solid #2a2c2e;
                    border-radius: 4px;
                    color: #d4c9b8;
                ">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="message" style="color: #d4c9b8; display: block; margin-bottom: 5px;">Сообщение *</label>
                <textarea id="message" name="message" rows="5" required style="
                    width: 100%;
                    padding: 10px;
                    background: #0d0e0f;
                    border: 1px solid #2a2c2e;
                    border-radius: 4px;
                    color: #d4c9b8;
                "></textarea>
            </div>

            <button type="submit" style="
                display: inline-block;
                background: #b22222;
                color: #fff;
                padding: 12px 30px;
                border: none;
                border-radius: 4px;
                font-family: 'Impact', sans-serif;
                letter-spacing: 2px;
                font-size: 1rem;
                cursor: pointer;
                transition: background 0.3s ease;
            "
            onmouseover="this.style.background='#ff3333';"
            onmouseout="this.style.background='#b22222';"
            >
                ОТПРАВИТЬ
            </button>
        </form>
    </div>
</div>

{% endblock %}
